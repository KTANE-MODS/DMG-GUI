<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTANE DMG GUI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>KTANE DMG GUI</h1>

    <h2 id="error-message">Loading JSON...</h2>
    <form id="mission-form" hidden>

        <section id="global-settings">
            <h2>Global Settings</h2>
            <label>
                Mission Name
                <input type="input">
            </label>
            <label>
                Mission Description
                <input type="input">
            </label>
            <label>
                Room (Optional)
                <input type="input">
            </label>
            <label>
                <input type="checkbox">
                Front Only
            </label>
            <h3>Factory Mode</h3>
            <label>
                Mode
                <select class="pool-type">
                    <option>Static</option>
                    <option>Infinite</option>
                    <option>Sequence</option>
                </select>
            </label>
            <label>
                <input type="checkbox">
                Global Time
            </label>
            <label>
                <input type="checkbox">
                Global Strikes
            </label>
        </section>

        <hr>

        <section id="bombs-section">
            <div class="section-header">
                <h2>Bombs</h2>
            </div>

            <div id="bomb-list">
            </div>
            <button type="button" id="add-bomb">+ Add Bomb</button>
        </section>

        <hr>

        <button type="button" id="generate">
            Generate Mission
        </button>

    </form>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
