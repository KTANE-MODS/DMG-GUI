<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KTANE DMG GUI</title>
</head>
<body>

    <h1>Global Setting</h1>
     <label for="mission-name">Mission Name:</label>
     <input
    type="text"
    id="mission-name"
    required
    size="10" />
    <label for="mission-description">Mission Description:</label>
     <input
    type="text"
    id="mission-description"
    name="mission-description"
    required
    size="10" />
    <label for="room">Room:</label>
     <input
    type="text"
    id="room"
    required
    size="10" />

    <label for="no-pacing">No Pacing</label>
    <input type="checkbox" id="no-pacing"/>




    <script type="module" src="dist/main.js"></script>
</body>
</html>
