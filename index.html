<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KTANE DMG GUI</title>
</head>
<body>
    <h1>KTANE DMG GUI</h1>

    <h2 id="loading">Loading JSON...</h2>
    <form id="mission-form">

        <section id="global-settings">
            <h2>Global Settings</h2>
        </section>

        <hr>

        <section id="bombs-section">
            <div class="section-header">
                <h2>Bombs</h2>
                <button type="button" id="add-bomb">
                    + Add Bomb
                </button>
            </div>

            <div id="bomb-list">
            </div>
        </section>

        <hr>

        <button type="submit">
            Generate Mission
        </button>

    </form>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
